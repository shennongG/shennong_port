; ==========================================================================
; ShennongPort config  --  Xiaomi 18 Pro Max (madrid)  ->  Xiaomi 14 Pro (shennong)
;
;   port : XMAPort engine (download / unpack / payload / migrate)
;   slim : 14PRO_SHALLOW_ROM app list + 14 Pro feature patches + budget auto-fit
;   pack : erofs + lpmake super.img (split _a/_b, 14 Pro layout) + zstd + zip
;
; Target: Xiaomi 14 Pro (shennong), super budget 8321499136 B (7.75 GiB).
; Donor : Xiaomi 18 Pro Max (madrid), HyperOS 4 / Android 17.
;         Target runs HyperOS 3 / Android 16 -- one major version gap, see
;         docs/PORT_18PROMAX_TO_14PRO.md before the first flash.
;
; NOTE: this file is pure ASCII on purpose. XMAPort reads it as GBK while the
;       slim/pack stages try UTF-8 first; ASCII is valid for both.
; ==========================================================================

; Device platform of the TARGET device: Qualcomm / MTK
; 14 Pro = SM8650 => Qualcomm. A wrong value can brick the phone.
device_platform=Qualcomm

[source]
; Source ROM = Xiaomi 18 Pro Max (donor system), full OTA zip direct URL.
; "madrid-ota_full-OS4.0.27.0.XEOCNXM-user-17.0" = HyperOS 4 / Android 17.
; Empty value = do not download, reuse the existing workspace.
; If the first boot hangs at the splash screen, try a slightly older madrid
; OS4 build first (smaller framework/vendor gap against the 14 Pro base).
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.27.0.XEOCNXM/madrid-ota_full-OS4.0.27.0.XEOCNXM-user-17.0-61443770bf.zip

[target]
; Target ROM = Xiaomi 14 Pro (shennong) BASE ROM: vendor / odm / firmware.
; "shennong-ota_full-OS3.0.310.0.WNBCNXM-user-16.0" = HyperOS 3 / Android 16.
url=https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.310.0.WNBCNXM/shennong-ota_full-OS3.0.310.0.WNBCNXM-user-16.0-9a177484fc.zip

[settings]
threads=16
max-connection=16
timeout=300
; 0 = download once, no retry
retry=5

[packing]
; erofs / ext4 -- keep erofs for HyperOS
format=erofs
compression=lz4hc
compression_level=9
erofs_old_kernel=false

; MUST build super.img: the slim stage and auto-fit are budget driven.
pack_super=true
; 14PRO_SHALLOW_ROM ships a raw super.img inside super.zst (TWRP updater-script
; and FlashWindows.bat both expect raw). Keep false for this layout.
sparse=false
utc_stamp=

; ---- super layout ----
; split_ab = the 14 Pro layout validated by 14PRO_SHALLOW_ROM:
;            <part>_a with image, <part>_b size 0, groups _a/_b, -F --virtual-ab
; single   = plain XMAPort layout (one group, no slot suffix)
; Use split_ab for shennong; single only for quick experiments.
super_style=split_ab

; ---- super budget: 7.75 GiB = 8321499136 B ----
; Must be <= the real super partition of the device. The base ROM value and
; tools/device_profiles.py are also consulted; the SMALLEST one wins.
device_size=8321499136
metadata_size=65536
metadata_slots=3
virtual_ab=true
super_name=super
super_group=qti_dynamic_partitions

; true = copy source system_ext.img directly (fast, no repack).
; Keep false for an 18 Pro Max donor: sync_apex must move the target VNDK APEX
; into the newer source system_ext, otherwise Android 17 system + Android 16
; vendor will not match.
is_skip_apex=false

; adb debug props -- handy during bring-up, set false for a daily build
enable_adb_debug=true

; disable AVB verification (needed to boot a ported super)
patch_vbmeta=true

; ---- merged-pipeline keys (port -> slim -> pack) ----
; vendor is patched (fstab / aptX / init.qcom.rc) => repack it instead of copy
repack_vendor=true
; mi_ext source: target (14 Pro base, 14PRO_SHALLOW_ROM behaviour) / source
mi_ext_source=target
; build the flashable zip after super.img
package_zip=true
; zstd / none
super_compress=zstd
zstd_level=12
; slim profile + tiers applied in step 6
slim_profile=shennong
slim_tiers=media,preinstall
; after packing, if the real images still exceed the 7.75 GiB budget, apply
; these tiers one by one and repack only the affected partitions
auto_fit=true
auto_fit_tiers=apps,audio,media,preinstall
margin_mib=64
; true = never download shennong_files (missing assets => those steps skip)
slim_offline=false

[shennong]
; master switch for the slim/patch stage
enable=true
; target codename (14 Pro)
device=shennong

; which steps to run: empty = the 15 default steps
;   overlay, device_features, displayconfig, powerkeeper, miaon, camera, msa,
;   bootanimation, build_props, density, aptx, recovery_stub, init_qcom,
;   fstab, firmware
; optional: signature (apktool), icons (network), kernelsu (Linux only)
steps=
skip_steps=
enable_signature=false
enable_icons=false
enable_kernelsu=false

; 14 Pro panel density written to product/etc/build.prop
density=560

; shennong_files cache (download with: python tools/assets.py fetch)
asset_dir=assets/shennong_files
; optional mirror prefix, e.g. https://ghfast.top/https://raw.githubusercontent.com/...
asset_base=

[slim]
; default profile = 14PRO_SHALLOW_ROM list; "none" disables the app list
slim_profile=shennong

; extra tiers, applied in order, only when you ask for them:
;   media / audio / preinstall / apps / custom
slim_tiers=media,preinstall

; manual removals, relative to the partition root:
;   product/app/MiShop,system/app/Foo
extra_remove=

; never delete these (partition-relative globs)
; e.g. media/audio/ringtones/*,app/MiuiCamera*
slim_keep=

; ============================================
; build.prop patch list (ported from XMAPort, 14 Pro values)
; appended to target odm/etc/build.prop
; ============================================
; patch build prop list
####################################
# from device/xiaomi/mivendor/common_rw.prop
####################################
persist.vendor.night.charge=true
####################################
# from device/xiaomi/zero/odm/special_rw.prop
####################################
persist.vendor.accelerate.charge=true
persist.vendor.battery.health=true
persist.vendor.extreme.mode=true
persist.vendor.hightemp.notice=true
persist.vendor.smartchg=854
persist.vendor.vcb.ability=true
persist.vendor.vcb.enable=false
ro.vendor.cabc.enable=false
ro.vendor.bcbc.enable=true
ro.vendor.dfps.enable=false
ro.vendor.fps.switch.default=true
ro.vendor.gcp.enable=1
; 14 Pro panel is 120Hz
ro.vendor.display.default_fps=120
ro.vendor.sre.enable=true
ro.vendor.localhbm.enable=true
ro.vendor.video_box.version=2
