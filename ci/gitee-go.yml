# XMAPort-SHALLOW / Gitee Go 流水线（轻量校验 + 源码包）
#
# 放这里的目的：Gitee 侧不需要 GitHub Actions 也能跑起来。
# Gitee Go 的 runner 是 Linux，没有 Windows/40 GB 磁盘，因此这里只做
#   「能跑起来 / 代码没坏 / 源码包能出」三件事；
# 真正的 ROM 全流程（下载 18 GB + 解包 + lpmake）请在 Windows 机器上跑：
#   pwsh -File ci/run_pipeline.ps1 -Stage all [-Publish]
#
# 启用方式：
#   1) 仓库 → 服务 → Gitee Go → 新建流水线 → 选择「仓库内 YAML」
#   2) 把本文件内容拷到 .workflow/build.yml（或直接用网页端生成的骨架，
#      把下面的 commands 粘进去）
#   3) 触发：push 到 main，或在网页端点「运行」
#
# 注意：step/inputs 的字段名受 Gitee Go 版本影响，网页端「步骤」面板显示的
# 参数名以页面为准；本文件的核心是下面的命令序列，插件名不一致时照着改即可。

version: 1.0
name: xmaport-shallow
displayName: XMAPort-SHALLOW 校验

triggers:
  trigger: auto
  push:
    branches:
      include:
        - main
        - master

stages:
  - stage:
      name: check
      displayName: 语法 / 自检 / 单元测试
      trigger: auto
      strategy:
        none:
      steps:
        - step: build@python
          name: pycheck
          displayName: Python 语法与离线测试
          pythonVersion: "3.12"
          commands:
            - python -V
            # 1) 全仓库语法编译（不产生 pyc 入库）
            - python -m compileall -q XMAPort.py tools tests
            # 2) 自检：只验工具链/配置/模块，不联网、不下 ROM
            - python XMAPort.py --selftest
            # 3) 离线单元回归（合成数据，不需要 ROM）
            - python tests/test_stages.py
            - python tests/test_payload_args.py
            # 4) 资源镜像链可见性（不下载，只打印顺序）
            - python tools/assets.py mirrors
          artifacts:
            - name: build-logs
              path:
                - workspace/*.log

  - stage:
      name: package
      displayName: 源码包
      trigger: auto
      strategy:
        none:
      steps:
        - step: build@python
          name: srcpack
          displayName: 打 Windows 源码包
          pythonVersion: "3.12"
          commands:
            - mkdir -p release
            - cp XMAPort.py config.ini LICENSE README.md release/
            - cp -r tools docs ci release/
            # 卡刷包要的工具在 tools/ 里，已经一起带走；workspace 不入包
            - cd release && zip -qr ../XMAPort-SHALLOW-src.zip . && cd ..
            - ls -lh XMAPort-SHALLOW-src.zip
          artifacts:
            - name: source-package
              path:
                - XMAPort-SHALLOW-src.zip
